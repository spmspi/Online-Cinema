services:
  db:
    image: 'postgres:17'
    container_name: postgres_cinema
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    container_name: cinema_web
    build: .
    restart: always
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./src:/app/src
  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"


volumes:
  postgres_data: